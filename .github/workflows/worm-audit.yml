name: WORM Audit Upload (OIDC)

on:
  workflow_dispatch:
  push:
    paths:
      - tools/itil5-ai-governance/approvals.log

permissions:
  id-token: write
  contents: read

jobs:
  worm-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WIF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "boto3>=1.34.0"

      - name: Upload audit log to WORM storage
        run: |
          python tools/trustless_audit/scripts/worm_upload.py \
            --log tools/itil5-ai-governance/approvals.log \
            --bucket "${{ vars.AWS_WORM_BUCKET }}" \
            --key "$(date +%Y)/$(date +%m)/approvals-$(date +%Y%m%d-%H%M%S).log" \
            --region "${{ vars.AWS_REGION || 'ap-northeast-1' }}"
